events {
    worker_connections 1024;
}

http {
    server {
        listen 8080;
        server_name localhost;

        location / {
            root ../tests/static/;
            jwt on;
            jwt_load_jwks file ../tests/test_success_jwks_load.json;
            jwt_load_jwks string "{\"keys\": [{\"kty\": \"oct\", \"alg\": \"HS256\", \"k\": \"HS256_KEY_VALUE_2_VERY_LONG_VALUE_AT_LEAST_32_BYTES_LONG\", \"kid\": \"2\"}]}";
            jwt_load_jwks url "https://localhost:8082/.unknown/jwks";
            jwt_validate exp leeway 5;
            jwt_validate nbf leeway 5;
            jwt_error_code 405;
        }
    }
}