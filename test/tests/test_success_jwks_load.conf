events {
    worker_connections 1024;
}

http {
    server {
        listen 8080;
        server_name localhost;

        location / {
            root ../static/;
            jwt bearer;
            jwt_load_jwks file ../tests/test_success_jwks_load.json;
            jwt_load_jwks string '{"keys":
    [
        {
            "kty": "oct",
            "alg": "HS256", 
            "k": "SFMyNTZfS0VZX1ZBTFVFXzJfVkVSWV9MT05HX1ZBTFVFX0FUX0xFQVNUXzMyX0JZVEVTX0xPTkc",
            "kid": "2"
        }
    ]
}';
            jwt_assert exp exp '5';
            jwt_assert nbf nbf '5';
            jwt_error_code 405;
        }
    }
}