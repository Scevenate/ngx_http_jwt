events {
    worker_connections 1024;
}

http {

    server {
        listen 8080;
        server_name localhost;

        location / {
            root ../static/;
            jwt cookie SOME_SESSION;
            jwt_load_jwks file ../tests/test_success_cookie.json;
            jwt_assert exp exp '5';
            jwt_assert nbf nbf '5';
            jwt_assert jwt_validate == '"jwt_validate"';
        }
    }
}