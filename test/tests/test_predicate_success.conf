events {
    worker_connections 1024;
}

http {

    server {
        listen 8080;
        server_name localhost;

        location / {
            root ../tests/static/;
            jwt query t;
            jwt_load_jwks file ../tests/test_predicate_success.json;
            jwt_validate exp exp '5';
            jwt_validate nbf nbf '10';
            jwt_validate food == '"bar"';
            jwt_validate null == '""';
            jwt_validate continent in '["Asia", "Africa", "NA", "SA", "EU", "Antarctica", "Oceania"]';
            jwt_validate time_signature in '[24, 44, 68, 67, 69]';
            jwt_error_code 404;
        }
    }
}