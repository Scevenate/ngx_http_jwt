events {
    worker_connections 1024;
}

http {

    server {
        listen 8080;
        server_name localhost;

        location / {
            root ../static/;
            jwt query t;
            jwt_load_jwks file ../tests/test_predicate_success.json;
            jwt_assert exp exp;
            jwt_assert nbf nbf;
            jwt_assert pop exists;
            jwt_assert food == '"bar"';
            jwt_assert null == '""';
            jwt_assert continent in '["Asia", "Africa", "NA", "SA", "EU", "Antarctica", "Oceania"]';
            jwt_assert time_signature in '[24, 44, 68, 67, 69]';
            jwt_error_code 404;
        }
    }
}