events {
    worker_connections 1024;
}

http {

    server {
        listen 8080;
        server_name localhost;

        location / {
            root ../static/;
            jwt bearer;
            jwt_load_jwks file ../tests/test_exp_fail.json;
            jwt_assert exp exp '5';
            jwt_assert nbf nbf '10';
            jwt_assert food == '"bar"';
            proxy_set_header bar $jwt_b64url_foo;
            jwt_error_code 429;
        }
    }
}