events {
    worker_connections 1024;
}

http {

    server {
        listen 8080;
        server_name localhost;

        location / {
            root ../tests/static/;
            jwt bearer;
            jwt_load_jwks file ../tests/test_exp_fail.json;
            jwt_validate exp exp '5';
            jwt_validate nbf nbf '10';
            jwt_validate food == '"bar"';
            jwt_extract foo bar optional;
            jwt_error_code 429;
        }
    }
}