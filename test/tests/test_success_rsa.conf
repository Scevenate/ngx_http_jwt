events {
    worker_connections 1024;
}

http {

    server {
        listen 8080;
        server_name localhost;
        
        location / {
            root ../static/;
            jwt bearer;
            jwt_load_jwks file ../tests/test_success_rsa.json;
            jwt_assert exp exp;
            jwt_assert nbf nbf;
            jwt_error_code 405;
        }
    }
}