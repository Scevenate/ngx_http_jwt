events {
    worker_connections 1024;
}

http {

    server {
        listen 8080;
        server_name localhost;

        location / {
            root ../static/;
            jwt bearer;
            jwt_load_jwks file ../tests/test_success_ed25519.json;
            jwt_validate exp exp '5';
            jwt_validate nbf nbf '5';
            jwt_validate food == '{"food": [null], "truth": "There is no food"}';
            jwt_extract foo bar optional;
            jwt_error_code 405;
        }
    }
}