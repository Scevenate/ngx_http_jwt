events {
    worker_connections 1024;
}

http {

    server {
        listen 8080;
        server_name localhost;

        location / {
            proxy_pass http://localhost:8081;
            jwt bearer;
            jwt_load_jwks string '{
    "keys": [
        {
            "kty": "oct",
            "alg": "HS256",
            "k": "dGVzdF9zZWNyZXRfa2V5XzMyX2J5dGVzX2xvbmchISE",
            "kid": "lowkey_a_kid"
        }
    ]
}';
            jwt_assert exp exp '5';
            jwt_assert nbf nbf '5';
            jwt_assert banner_name in '["承诺", "SEALED WITH TIME"]';
            jwt_assert api_version == '0';
            jwt_assert game_version == '1.41';
            jwt_assert metadata == '{"type": "pull request", "DSCP": {"enable": false}}';
            jwt_assert fragment == 'false';
            jwt_assert last_fragment == 'true';
            jwt_assert priority == 'null';
            jwt_assert p == '["a", "b", "c", null]';
            proxy_set_header banner_name $jwt_b64url_banner_name;
            proxy_set_header pulls $jwt_b64url_pulls;
            proxy_set_header admin $jwt_b64url_admin;
        }
    }
}