events {
    worker_connections 1024;
}

http {

    server {
        listen 8080;
        server_name localhost;

        location / {
            root ../static/;
            jwt bearer;
            jwt_load_jwks file ../tests/test_validation_number_fail.json;
            jwt_assert exp exp '5';
            jwt_assert nbf nbf '5';
            jwt_assert food == '"bar"';
            jwt_assert price == '100.75';
            jwt_assert amount == '3';
            jwt_assert discount == '-4.9';
            jwt_assert organization_id == '0';
            jwt_assert api_key == 'null';
        }
    }
}